# `docker compose up --build` starts PostgreSQL, LocalStack, a one-off setup (migrations and
# queues) and three application instances behind nginx. The image is built once, by setup,
# and reused by the instances. Host ports can be changed with APP_PORT (3000), POSTGRES_PORT
# (5440) and LOCALSTACK_PORT (4566).
# stop_grace_period must exceed the SQS long poll (SQS_WAIT_TIME_SECONDS) plus the tick in flight.
x-app: &app
  image: jungle-wagering-app
  environment: &app-environment
    PORT: "3000"
    DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    SQS_ENDPOINT: http://localstack:4566
    AWS_REGION: us-east-1
    LOG_LEVEL: info
  stop_grace_period: 30s
  depends_on:
    setup:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/health/ready'); process.exit(r.ok ? 0 : 1)"]
    interval: 3s
    timeout: 3s
    retries: 20

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: sqs
      EAGER_SERVICE_LOADING: "1"
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"\\(running\\|available\\)\"'"]
      interval: 2s
      timeout: 3s
      retries: 30

  setup:
    build: .
    image: jungle-wagering-app
    command: ["bun", "run", "src/setup.ts"]
    environment: *app-environment
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  app-1:
    <<: *app
  app-2:
    <<: *app
  app-3:
    <<: *app

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      app-3:
        condition: service_healthy

volumes:
  postgres-data:
