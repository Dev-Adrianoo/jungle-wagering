# A request that fails on one instance is tried on another. For a POST that is safe only on
# the wagering route, where the Idempotency-Key makes the second attempt return the result of
# the first; every other POST is never sent twice. /metrics is per instance, so it is not
# served through the balancer.
events {}

http {
  upstream wagering {
    server app-1:3000;
    server app-2:3000;
    server app-3:3000;
  }

  server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_next_upstream_timeout 10s;
    proxy_next_upstream_tries 3;
    proxy_next_upstream error timeout http_502 http_503;

    location = /metrics {
      return 404;
    }

    location = /wagering/transactions {
      proxy_pass http://wagering;
      proxy_next_upstream error timeout http_502 http_503 non_idempotent;
    }

    location / {
      proxy_pass http://wagering;
    }
  }
}
