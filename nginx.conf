# Retrying a POST on another instance is safe because transactions are idempotent by key:
# if an instance dies midway, the replay on another one returns the same result.
events {}

http {
  upstream wagering {
    server app-1:3000;
    server app-2:3000;
    server app-3:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://wagering;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_next_upstream error timeout http_502 http_503 non_idempotent;
      proxy_connect_timeout 2s;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
