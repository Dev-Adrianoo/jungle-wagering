# A request that cannot reach an instance (connection error, timeout, 502) is tried on
# another. For a POST that is safe only on the wagering route, where the Idempotency-Key makes
# the second attempt return the result of the first; every other POST is never sent twice.
# A 503 from the application is passed to the caller as it is: it means "retry later" (lock
# wait exhausted, a dependency down), another instance would answer the same, and counting it
# as a failed instance would take every instance out of rotation during a burst.
# /metrics is per instance, so it is not served through the balancer.
events {}

http {
  upstream wagering {
    server app-1:3000;
    server app-2:3000;
    server app-3:3000;
  }

  server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_next_upstream_timeout 10s;
    proxy_next_upstream_tries 3;
    proxy_next_upstream error timeout http_502;

    location = /metrics {
      return 404;
    }

    location = /wagering/transactions {
      proxy_pass http://wagering;
      proxy_next_upstream error timeout http_502 non_idempotent;
    }

    location / {
      proxy_pass http://wagering;
    }
  }
}
