name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  integration:
    name: Integration tests with PostgreSQL and SQS
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: postgres://wagering:wagering@localhost:5440/wagering
      TEST_SQS_ENDPOINT: http://localhost:4566
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: docker compose up -d --wait postgres localstack
      - run: bun run test:integration
      - run: bun run test:regression
      - run: bun run test:concurrency
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down -v
