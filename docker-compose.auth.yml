# Optional overlay that turns real authentication on:
#   docker compose -f docker-compose.yml -f docker-compose.auth.yml up --build
# It adds Keycloak with the realm in keycloak/realm.json (development clients and secrets
# only) and starts the instances with AUTH_MODE=oidc. Tokens carry the public address
# (localhost and KEYCLOAK_PORT) as issuer; the instances fetch the keys through the Compose
# network, which KC_HOSTNAME_BACKCHANNEL_DYNAMIC allows.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  app-1:
    environment:
      AUTH_MODE: oidc
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/wagering
      OIDC_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
      OIDC_AUDIENCE: wagering-api
    depends_on:
      keycloak:
        condition: service_healthy
  app-2:
    environment:
      AUTH_MODE: oidc
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/wagering
      OIDC_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
      OIDC_AUDIENCE: wagering-api
    depends_on:
      keycloak:
        condition: service_healthy
  app-3:
    environment:
      AUTH_MODE: oidc
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/wagering
      OIDC_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
      OIDC_AUDIENCE: wagering-api
    depends_on:
      keycloak:
        condition: service_healthy
